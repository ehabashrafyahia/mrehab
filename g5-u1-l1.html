<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة النمو السكاني | منصة أطلس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); min-height: 100vh; user-select: none; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.1); border-radius: 2rem; }
        .option-box { background: white; border: 2px solid #e2e8f0; transition: all 0.3s ease; text-align: right; cursor: pointer; position: relative; overflow: hidden; }
        .option-box:hover { border-color: #8b5cf6; transform: scale(1.02); }
        .option-box.selected { background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); border-color: transparent; color: white; }
        .opt-prefix { background: #f1f5f9; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 900; color: #64748b; flex-shrink: 0; }
        .option-box.selected .opt-prefix { background: rgba(255, 255, 255, 0.2); color: white; }
        .progress-glow { height: 100%; background: linear-gradient(90deg, #a855f7, #6366f1); box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); border-radius: 100px; transition: width 0.6s ease; }
        .btn-confirm { background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%); box-shadow: 0 15px 30px -10px rgba(109, 40, 217, 0.4); }
        #exit-modal { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="exit-modal" class="fixed inset-0 z-[2000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <h3 class="text-xl font-900 text-slate-800 mb-2">هل تريد الخروج؟</h3>
            <div class="flex gap-3 mt-6">
                <a href="grade5.html" class="flex-1 py-3 bg-red-50 text-red-600 rounded-2xl font-bold text-center text-sm">خروج</a>
                <button onclick="toggleExitModal(false)" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-2xl font-bold text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="quiz-wrapper" class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <button onclick="toggleExitModal(true)" class="flex items-center gap-2 p-3 bg-white rounded-2xl shadow-sm text-slate-500 border border-slate-100">
                <i class="fas fa-sign-out-alt rotate-180"></i>
                <span class="font-bold text-sm text-slate-800">خروج</span>
            </button>
            <div class="bg-white px-6 py-2 rounded-2xl shadow-sm border border-slate-100 font-900 text-purple-600">
                <span id="q-count">1</span> / 40
            </div>
            <div class="p-3 bg-purple-50 rounded-2xl text-purple-500"><i class="fas fa-map-marked-alt"></i></div>
        </div>

        <div class="h-3 bg-slate-200 rounded-full mb-12 overflow-hidden">
            <div id="progress-bar" class="progress-glow" style="width: 0%;"></div>
        </div>

        <div class="glass-card p-8 md:p-12 mb-10">
            <h2 id="main-question" class="text-xl md:text-2xl font-900 text-slate-800 leading-snug text-center mb-12 min-h-[3rem]">جارٍ تحميل السؤال...</h2>
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
        </div>

        <button onclick="goToNext()" class="btn-confirm w-full py-6 rounded-3xl text-white font-900 text-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
            <span>تأكيد الإجابة</span>
            <i class="fas fa-chevron-left"></i>
        </button>
    </div>

    <div id="result-view" class="hidden max-w-xl mx-auto text-center pt-10">
        <div class="glass-card p-12 bg-white mb-6 border-2 border-purple-100">
            <div class="text-7xl mb-6">🏆</div>
            <h1 class="text-4xl font-900 text-slate-800 mb-2">نتيجة الاختبار</h1>
            <p class="text-slate-500 font-bold mb-8">موقع مصر الفلكي</p>
            <div class="relative inline-block mb-10">
                <svg class="w-40 h-40 transform -rotate-90">
                    <circle cx="80" cy="80" r="70" stroke="#f1f5f9" stroke-width="12" fill="transparent" />
                    <circle id="score-circle" cx="80" cy="80" r="70" stroke="#a855f7" stroke-width="12" fill="transparent" stroke-dasharray="440" stroke-dashoffset="440" class="transition-all duration-1000" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="font-900 text-4xl text-slate-800" id="score-text">0%</span>
                </div>
            </div>
            <div id="result-msg" class="text-xl font-black text-purple-600"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="location.reload()" class="py-4 bg-purple-100 text-purple-700 rounded-2xl font-bold shadow-lg">إعادة</button>
            <a href="grade5.html" class="py-4 bg-slate-800 text-white rounded-2xl font-bold shadow-lg flex items-center justify-center">الرئيسية</a>
        </div>
    </div>

    <script>
        const questions = [
    { q: "تساعدنا شبكة الإحداثيات عند استكشاف الأماكن على:", a: ["معرفة عدد السكان", "تحديد مواقع الأماكن على سطح الأرض", "معرفة أنواع المناخ فقط", "تحديد الموارد الاقتصادية"], c: 1 },

    { q: "تتكون شبكة الإحداثيات من نوعين من الخطوط هما:", a: ["خطوط الطول ودوائر العرض", "خطوط الطول وخطوط الارتفاع", "دوائر العرض وخطوط الحدود", "خطوط الاستواء وخطوط الطول فقط"], c: 0 },

    { q: "يقصد بخطوط الطول أنها:", a: ["دوائر أفقية ترسم حول الأرض", "أنصاف دوائر تصل بين القطبين الشمالي والجنوبي", "خطوط تحدد حدود الدول", "خطوط تحدد الارتفاع عن سطح البحر"], c: 1 },

    { q: "يبلغ عدد خطوط الطول على سطح الأرض:", a: ["90 خطًا", "180 خطًا", "360 خطًا", "365 خطًا"], c: 2 },

    { q: "خط الطول الرئيسي الذي درجته صفر هو خط:", a: ["الاستواء", "جرينتش", "السرطان", "الجدي"], c: 1 },

    { q: "من أهمية خطوط الطول أنها تساعد في:", a: ["تحديد المواقع شرقًا وغربًا ومعرفة فروق التوقيت", "تحديد المناطق الزراعية فقط", "تحديد عدد السكان", "معرفة درجات الحرارة فقط"], c: 0 },

    { q: "يبلغ فرق التوقيت بين كل خط طول والخط الذي يليه:", a: ["دقيقة واحدة", "دقيقتين", "4 دقائق", "10 دقائق"], c: 2 },

    { q: "إذا تحركنا من الغرب إلى الشرق فإن التوقيت:", a: ["يتأخر", "يتقدم", "لا يتغير", "يتوقف"], c: 1 },

    { q: "تدور الأرض حول نفسها دورة كاملة كل:", a: ["12 ساعة", "24 ساعة", "36 ساعة", "48 ساعة"], c: 1 },

    { q: "ينتج عن دوران الأرض حول نفسها من الغرب إلى الشرق:", a: ["تعاقب الليل والنهار", "الفصول الأربعة", "اختلاف التضاريس", "اختلاف مساحة القارات"], c: 0 },

    { q: "إذا كان فرق خطوط الطول بين مدينتين 30 خط طول، فإن فرق التوقيت بينهما يساوي:", a: ["30 دقيقة", "60 دقيقة", "120 دقيقة", "180 دقيقة"], c: 2 },

    { q: "دوائر العرض هي:", a: ["أنصاف دوائر تصل بين القطبين", "دوائر أفقية غير متساوية ترسم حول الكرة الأرضية", "خطوط رأسية تصل بين الشرق والغرب", "خطوط تحدد حدود الدول"], c: 1 },

    { q: "يبلغ عدد دوائر العرض:", a: ["90 دائرة", "180 دائرة", "360 دائرة", "365 دائرة"], c: 1 },

    { q: "دائرة العرض الرئيسية ودرجتها صفر هي دائرة:", a: ["السرطان", "الجدي", "الاستواء", "جرينتش"], c: 2 },

    { q: "تقسم دائرة الاستواء الكرة الأرضية إلى نصفين هما:", a: ["شرقي وغربي", "شمالي وجنوبي", "صحراوي وزراعي", "آسيوي وأفريقي"], c: 1 },

    { q: "تبلغ درجة مدار السرطان:", a: ["23.5° شمال دائرة الاستواء", "23.5° جنوب دائرة الاستواء", "66.5° شمال دائرة الاستواء", "66.5° جنوب دائرة الاستواء"], c: 0 },

    { q: "تبلغ درجة مدار الجدي:", a: ["23.5° شمال دائرة الاستواء", "23.5° جنوب دائرة الاستواء", "66.5° شمال دائرة الاستواء", "90° جنوب دائرة الاستواء"], c: 1 },

    { q: "تبلغ درجة دائرة العرض القطبية الشمالية:", a: ["23.5° شمالًا", "45° شمالًا", "66.5° شمالًا", "90° شمالًا"], c: 2 },

    { q: "تبلغ درجة دائرة العرض القطبية الجنوبية:", a: ["66.5° جنوبًا", "23.5° جنوبًا", "45° جنوبًا", "90° جنوبًا"], c: 0 },

    { q: "من أهمية دوائر العرض أنها تساعد في:", a: ["تحديد المواقع شمالًا وجنوبًا ودراسة المناخ", "معرفة فروق التوقيت فقط", "تحديد عدد خطوط الطول", "تحديد حدود الدول السياسية"], c: 0 },

    { q: "تتشابه خطوط الطول ودوائر العرض في أنها:", a: ["خطوط حقيقية موجودة على سطح الأرض", "خطوط وهمية رسمها العلماء لتحديد مواقع الأماكن بدقة", "تحدد فروق التوقيت فقط", "تستخدم لدراسة السكان فقط"], c: 1 },

    { q: "الموقع الفلكي لمصر هو موقعها بالنسبة إلى:", a: ["البحار والمحيطات", "خطوط الطول ودوائر العرض", "الدول المجاورة", "الجبال والهضاب"], c: 1 },

    { q: "تقع مصر فلكيًا بين خطي طول:", a: ["25° و37° شرق جرينتش", "22° و31.5° شرق جرينتش", "25° و37° غرب جرينتش", "0° و23.5° شرق جرينتش"], c: 0 },

    { q: "تقع مصر فلكيًا بين دائرتي عرض:", a: ["25° و37° شرق جرينتش", "22° و31.5° شمالًا", "23.5° و66.5° شمالًا", "0° و23.5° جنوبًا"], c: 1 },

    { q: "يمر مدار السرطان بـ:", a: ["شمال مصر", "جنوب مصر", "وسط القاهرة فقط", "شمال البحر المتوسط"], c: 1 },

    { q: "تقع مصر بالنسبة إلى دائرة الاستواء في:", a: ["النصف الجنوبي", "النصف الشمالي", "النصف الغربي", "منطقة القطب الشمالي"], c: 1 },

    { q: "تقع مصر بالنسبة إلى خط جرينتش في:", a: ["النصف الغربي", "النصف الشرقي", "على خط جرينتش مباشرة", "جنوب خط جرينتش"], c: 1 },

    { q: "من استخدامات المصريين القدماء للفلك:", a: ["تحديد المواقع وتوقيت الزراعة وتنظيم الأعياد الدينية وبناء الأهرامات", "تحديد الحدود السياسية الحديثة", "تحديد عدد السكان", "صناعة الطائرات"], c: 0 },

    { q: "إذا كانت الساعة في لندن 3 مساءً، وتقع الإسكندرية على خط طول 30° شرقًا، فإن الساعة في الإسكندرية تكون:", a: ["1 مساءً", "3 مساءً", "5 مساءً", "7 مساءً"], c: 2 },

    { q: "إذا كانت مدينة تقع على خط طول 30° شرق جرينتش، فإن فرق التوقيت بينها وبين جرينتش يساوي:", a: ["30 دقيقة", "60 دقيقة", "120 دقيقة", "180 دقيقة"], c: 2 },

    { q: "السبب في تقدم توقيت المدن الواقعة شرق جرينتش عن المدن الواقعة غربه هو أن الأرض:", a: ["تدور من الشرق إلى الغرب", "تدور من الغرب إلى الشرق", "ثابتة لا تدور", "تدور من الشمال إلى الجنوب"], c: 1 },

    { q: "أكبر دوائر العرض الرئيسية هي:", a: ["مدار السرطان", "مدار الجدي", "دائرة الاستواء", "الدائرة القطبية الشمالية"], c: 2 },

    { q: "إحدى دوائر العرض الرئيسية التي تقع في النصف الجنوبي ودرجتها 23.5° هي:", a: ["مدار السرطان", "مدار الجدي", "دائرة الاستواء", "الدائرة القطبية الجنوبية"], c: 1 },

    { q: "إحدى دوائر العرض الرئيسية التي تقع في النصف الشمالي ودرجتها 23.5° هي:", a: ["مدار السرطان", "مدار الجدي", "دائرة الاستواء", "الدائرة القطبية الشمالية"], c: 0 },

    { q: "تساعد دوائر العرض في دراسة المناخ من حيث:", a: ["الحرارة والرياح والمطر", "عدد السكان فقط", "التجارة والصناعة فقط", "الحدود السياسية"], c: 0 },

    { q: "إذا تحركنا شرقًا عبر خطوط الطول فإن الوقت:", a: ["يتقدم", "يتأخر", "يظل ثابتًا", "يتغير كل 24 ساعة فقط"], c: 0 },

    { q: "إذا تحركنا غربًا عبر خطوط الطول فإن الوقت:", a: ["يتقدم", "يتأخر", "لا يتغير", "يتوقف"], c: 1 },

    { q: "الخطوط التي تمتد من القطب الشمالي إلى القطب الجنوبي تسمى:", a: ["دوائر العرض", "خطوط الطول", "دوائر الاستواء", "الدوائر القطبية"], c: 1 },

    { q: "الخطوط التي تمتد بصورة أفقية حول الكرة الأرضية تسمى:", a: ["خطوط الطول", "دوائر العرض", "خط جرينتش", "خطوط الحدود"], c: 1 },

    { q: "يقع خط جرينتش في مدينة:", a: ["القاهرة", "لندن", "الإسكندرية", "أسوان"], c: 1 },

    { q: "تحديد الموقع الفلكي لمصر يفيد في معرفة موقعها بالنسبة إلى:", a: ["خطوط الطول ودوائر العرض", "عدد المحافظات فقط", "الموارد المعدنية فقط", "الدول العربية فقط"], c: 0 }
];

        let index = 0, score = 0, picked = null;

        // دالة البدء
        function initQuiz() {
            if (questions && questions.length > 0) {
                render();
            }
        }

        function render() {
            picked = null;
            const q = questions[index];
            
            // تحديث نص السؤال والعداد
            document.getElementById('main-question').innerText = q.q;
            document.getElementById('q-count').innerText = index + 1;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            q.a.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = 'option-box p-5 md:p-6 rounded-2xl flex items-center gap-4 transition-all';
                btn.innerHTML = `
                    <div class="opt-prefix">${String.fromCharCode(65 + i)}</div>
                    <span class="font-bold text-sm md:text-base text-slate-700">${opt}</span>
                `;
                btn.onclick = () => {
                    document.querySelectorAll('.option-box').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    picked = i;
                };
                grid.appendChild(btn);
            });
            
            // تحديث شريط التقدم
            document.getElementById('progress-bar').style.width = ((index / questions.length) * 100) + '%';
        }

        function goToNext() {
            if (picked === null) {
                Swal.fire({text:'اختر إجابة أولاً يا بطل!', icon:'warning', confirmButtonColor: '#8b5cf6'});
                return;
            }
            if (picked === questions[index].c) score++;
            
            index++;
            if (index < questions.length) {
                render();
            } else {
                finish();
            }
        }

        function finish() {
            document.getElementById('quiz-wrapper').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            const pct = Math.round((score / questions.length) * 100);
            document.getElementById('score-text').innerText = pct + '%';
            document.getElementById('score-circle').style.strokeDashoffset = 440 - (440 * pct) / 100;
            document.getElementById('result-msg').innerText = pct >= 50 ? "أداء رائع يا بطل أطلس!" : "راجع الدرس وحاول مرة أخرى!";
        }

        function toggleExitModal(s) { 
            document.getElementById('exit-modal').style.display = s ? 'flex' : 'none'; 
        }

        // تشغيل الكود فور تحميل الصفحة
        window.onload = initQuiz;
    </script>
</body>
</html>
