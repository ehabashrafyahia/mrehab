<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار سكان إفريقيا | مراجعة ذاتية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); 
            min-height: 100vh; 
            user-select: none; 
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.1); 
            border-radius: 2rem; 
        }
        .option-box { 
            background: white; border: 2px solid #e2e8f0; 
            transition: all 0.3s ease; text-align: right; cursor: pointer; 
        }
        .option-box:hover { border-color: #8b5cf6; transform: scale(1.02); }
        .option-box.selected { 
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); 
            border-color: transparent; color: white; 
        }
        .opt-prefix { 
            background: #f1f5f9; width: 38px; height: 38px; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 10px; font-weight: 900; color: #64748b; 
        }
        .option-box.selected .opt-prefix { background: rgba(255, 255, 255, 0.2); color: white; }
        .progress-glow { 
            height: 100%; background: linear-gradient(90deg, #a855f7, #6366f1); 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); border-radius: 100px; 
            transition: width 0.6s ease; 
        }
        .btn-confirm { 
            background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%); 
            box-shadow: 0 15px 30px -10px rgba(109, 40, 217, 0.4); 
        }
        #exit-modal { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="exit-modal" class="fixed inset-0 z-[2000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <h3 class="text-xl font-900 text-slate-800 mb-2">هل تريد الخروج؟</h3>
            <div class="flex gap-3 mt-6">
                <a href="grade7.html" class="flex-1 py-3 bg-red-50 text-red-600 rounded-2xl font-bold text-center">خروج</a>
                <button onclick="toggleExitModal(false)" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-2xl font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="quiz-wrapper" class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <button onclick="toggleExitModal(true)" class="flex items-center gap-2 p-3 bg-white rounded-2xl shadow-sm text-slate-500 border border-slate-100 transition-colors hover:text-red-500">
                <i class="fas fa-sign-out-alt rotate-180"></i>
                <span class="font-bold text-sm text-slate-800">خروج</span>
            </button>
            <div class="bg-white px-6 py-2 rounded-2xl shadow-sm border border-slate-100 font-900 text-purple-600">
                <span id="q-count">1</span> / 50
            </div>
            <div class="p-3 bg-purple-50 rounded-2xl text-purple-500"><i class="fas fa-graduation-cap"></i></div>
        </div>

        <div class="h-3 bg-slate-200 rounded-full mb-12 overflow-hidden">
            <div id="progress-bar" class="progress-glow" style="width: 0%;"></div>
        </div>

        <div class="glass-card p-8 md:p-12 mb-10">
            <h2 id="main-question" class="text-2xl md:text-3xl font-900 text-slate-800 leading-snug text-center mb-12">جاري التحميل...</h2>
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
        </div>

        <button onclick="goToNext()" class="btn-confirm w-full py-6 rounded-3xl text-white font-900 text-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
            <span>تأكيد الإجابة</span>
            <i class="fas fa-chevron-left"></i>
        </button>
    </div>

    <div id="result-view" class="hidden max-w-xl mx-auto text-center pt-10">
        <div class="glass-card p-12 bg-white mb-6 border-2 border-purple-100">
            <div class="text-7xl mb-6">🏆</div>
            <h1 class="text-4xl font-900 text-slate-800 mb-2">نتيجة الاختبار</h1>
            <p class="text-slate-500 font-bold mb-8">أفريقيا (الموقع والكشوف الجغرافية)</p>
            
            <div class="relative inline-block mb-10">
                <svg class="w-40 h-40 transform -rotate-90">
                    <circle cx="80" cy="80" r="70" stroke="#f1f5f9" stroke-width="12" fill="transparent" />
                    <circle id="score-circle" cx="80" cy="80" r="70" stroke="#a855f7" stroke-width="12" fill="transparent" stroke-dasharray="440" stroke-dashoffset="440" class="transition-all duration-1000" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="font-900 text-4xl text-slate-800" id="score-text">0%</span>
                </div>
            </div>
            <div id="result-msg" class="text-xl font-black text-purple-600"></div>
        </div>

        <div class="flex flex-col gap-4">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="location.reload()" class="py-4 bg-purple-100 text-purple-700 rounded-2xl font-bold shadow-lg hover:bg-purple-200 transition">إعادة</button>
                <a href="grade7.html" class="py-4 bg-slate-800 text-white rounded-2xl font-bold shadow-lg flex items-center justify-center hover:bg-slate-700 transition">الرئيسية</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
    { q: "تُعد قارة إفريقيا من قارات العالم القديم، ويقع جزء منها في:", a: ["نصف الكرة الشمالي فقط", "نصف الكرة الجنوبي فقط", "نصفي الكرة الشمالي والجنوبي", "النصف الغربي فقط"], c: 2 },

    { q: "تأتي قارة إفريقيا من حيث المساحة في المرتبة:", a: ["الأولى عالميًا", "الثانية عالميًا", "الثالثة عالميًا", "الرابعة عالميًا"], c: 1 },

    { q: "تبلغ مساحة قارة إفريقيا حوالي:", a: ["3.4 مليون كم²", "10.4 مليون كم²", "30.4 مليون كم²", "40.4 مليون كم²"], c: 2 },

    { q: "تمثل مساحة إفريقيا حوالي ........ من مساحة اليابس على سطح الأرض:", a: ["10%", "20%", "30%", "40%"], c: 1 },

    { q: "تقع قارة إفريقيا بالنسبة لخط الاستواء في:", a: ["النصف الشمالي فقط", "النصف الجنوبي فقط", "نصفي الكرة الأرضية تقريبًا", "النصف الشرقي فقط"], c: 2 },

    { q: "يمتد الموقع الفلكي لقارة إفريقيا بين دائرتي عرض:", a: ["37° شمالًا و34° جنوبًا تقريبًا", "23.5° شمالًا و23.5° جنوبًا", "10° شمالًا و10° جنوبًا", "66.5° شمالًا و66.5° جنوبًا"], c: 0 },

    { q: "تمتد قارة إفريقيا بين خطي طول حوالي:", a: ["17° غربًا و51° شرقًا", "51° غربًا و17° شرقًا", "0° و30° شرقًا", "30° غربًا و30° شرقًا"], c: 0 },

    { q: "يمر خط الطول الرئيسي جرينتش في قارة إفريقيا عبر:", a: ["نصفها الشرقي", "نصفها الغربي", "جنوبها فقط", "شمالها فقط"], c: 1 },

    { q: "يحد قارة إفريقيا من الشمال:", a: ["المحيط الأطلسي", "المحيط الهندي", "البحر المتوسط", "البحر الأحمر"], c: 2 },

    { q: "يحد قارة إفريقيا من الشرق:", a: ["المحيط الأطلسي", "البحر الأحمر والمحيط الهندي", "البحر المتوسط", "المحيط الهادئ"], c: 1 },

    { q: "يحد قارة إفريقيا من الغرب:", a: ["المحيط الهندي", "البحر الأحمر", "المحيط الأطلسي", "البحر المتوسط"], c: 2 },

    { q: "يفصل البحر المتوسط قارة إفريقيا عن قارة:", a: ["آسيا", "أوروبا", "أمريكا الشمالية", "أستراليا"], c: 1 },

    { q: "يفصل البحر الأحمر قارة إفريقيا عن قارة:", a: ["أوروبا", "أمريكا الجنوبية", "آسيا", "أمريكا الشمالية"], c: 2 },

    { q: "يفصل المحيط الأطلسي قارة إفريقيا عن قارتي:", a: ["آسيا وأوروبا", "أمريكا الشمالية وأمريكا الجنوبية", "أستراليا وآسيا", "أوروبا وآسيا"], c: 1 },

    { q: "تقترب إفريقيا من قارة آسيا عند:", a: ["مضيق جبل طارق", "مضيق باب المندب", "مضيق بيرنج", "مضيق ملقا"], c: 1 },

    { q: "تقترب إفريقيا من قارة أوروبا عند:", a: ["مضيق باب المندب", "مضيق جبل طارق", "قناة السويس", "خليج عدن"], c: 1 },

    { q: "تتصل إفريقيا بآسيا عن طريق:", a: ["شبه جزيرة سيناء", "جزيرة مدغشقر", "مضيق جبل طارق", "خليج غينيا"], c: 0 },

    { q: "من أهم الممرات المائية التي تتميز بها قارة إفريقيا:", a: ["قناة السويس", "قناة بنما", "قناة كيل", "قناة كورنث"], c: 0 },

    { q: "من أمثلة الممرات المائية المهمة التي تشرف عليها إفريقيا:", a: ["مضيق جبل طارق", "مضيق هرمز فقط", "مضيق ملقا فقط", "مضيق بيرنج فقط"], c: 0 },

    { q: "تتمتع قارة إفريقيا بأهمية استراتيجية بسبب:", a: ["موقعها الجغرافي وإشرافها على ممرات مائية مهمة", "قلة مواردها الطبيعية", "بعدها عن القارات الأخرى", "وجودها بالكامل في نصف الكرة الجنوبي"], c: 0 },

    { q: "من أمثلة الممرات المائية التي تزيد من الأهمية الاستراتيجية لإفريقيا:", a: ["قناة السويس ومضيق باب المندب ومضيق جبل طارق", "مضيق ملقا وقناة بنما فقط", "مضيق بيرنج وقناة كيل", "مضيق هرمز وقناة بنما"], c: 0 },

    { q: "ترجع الأهمية الاقتصادية لموقع إفريقيا إلى أنه أدى إلى:", a: ["تحكمها في أهم طرق الملاحة العالمية", "قلة حركة التجارة بها", "انعزالها عن العالم", "اختفاء التنوع المناخي بها"], c: 0 },

    { q: "أدى الموقع الفلكي لقارة إفريقيا إلى تنوع:", a: ["المناخ", "الحدود السياسية فقط", "عدد الدول فقط", "الممرات المائية فقط"], c: 0 },

    { q: "من نتائج تنوع المناخ في قارة إفريقيا:", a: ["تنوع النباتات الطبيعية", "اختفاء الحيوانات", "قلة المحاصيل الزراعية", "ثبات درجات الحرارة في جميع المناطق"], c: 0 },

    { q: "من نتائج تنوع المناخ في إفريقيا:", a: ["تنوع الحيوانات", "اختفاء الغابات", "ثبات الإنتاج الزراعي", "قلة الموارد الطبيعية"], c: 0 },

    { q: "من نتائج تنوع المناخ في قارة إفريقيا:", a: ["تنوع المحاصيل الزراعية", "اختفاء الزراعة", "تشابه النباتات في كل القارة", "قلة التنوع الحيوي"], c: 0 },

    { q: "ترجع الأهمية الحضارية لقارة إفريقيا إلى:", a: ["نشأة العديد من أقدم الحضارات في العالم على أرضها", "قلة الحضارات القديمة بها", "بعدها عن مصادر المياه", "عدم وجود أنهار بها"], c: 0 },

    { q: "من الحضارات القديمة التي نشأت في إفريقيا:", a: ["الحضارة المصرية القديمة", "الحضارة الرومانية فقط", "الحضارة الصينية", "حضارة الإنكا"], c: 0 },

    { q: "تقع حضارة قرطاج القديمة في:", a: ["تونس", "مصر", "السودان", "إثيوبيا"], c: 0 },

    { q: "تقع حضارة كوش في:", a: ["السودان", "تونس", "المغرب", "جنوب إفريقيا"], c: 0 },

    { q: "تقع حضارة أكسوم في:", a: ["إثيوبيا وإريتريا", "مصر وليبيا", "تونس والجزائر", "السودان وتشاد"], c: 0 },

    { q: "ترجع أهمية شبه جزيرة سيناء الحضارية إلى أنها:", a: ["كانت طريقًا لانتقال بعض الثقافات والحضارات بين آسيا وإفريقيا", "تمنع الاتصال بين القارتين", "تقع في غرب إفريقيا", "لا ترتبط بقارة آسيا"], c: 0 },

    { q: "ترجع الأهمية الاستراتيجية لشبه جزيرة سيناء إلى:", a: ["تعرض مصر للعديد من الحملات العسكرية من خلالها", "بعدها عن حدود مصر", "عدم اتصالها بآسيا", "وجودها في جنوب إفريقيا"], c: 0 },

    { q: "يرتبط الحفاظ على أمن شبه جزيرة سيناء بـ:", a: ["الأمن القومي المصري والإفريقي", "الأمن الأوروبي فقط", "الأمن الآسيوي فقط", "الأمن الأمريكي فقط"], c: 0 },

    { q: "كان للمصريين القدماء دور مهم في اكتشاف قارة إفريقيا من خلال:", a: ["الرحلات الاستكشافية", "الهجرة إلى أوروبا", "بناء المدن الحديثة", "رسم الحدود السياسية الحالية"], c: 0 },

    { q: "قام المصريون القدماء بأربع رحلات نحو الجنوب خلال:", a: ["عصر الأسرة الخامسة والسادسة", "العصر الحديث", "العصر البطلمي فقط", "العصر الروماني"], c: 0 },

    { q: "من أشهر رحلات المصريين القدماء حول إفريقيا رحلة:", a: ["حر-خوف", "ابن بطوطة", "هنري الملاح", "ديفيد ليفنجستون"], c: 0 },

    { q: "أرسل الملك نخاو الثاني بعثة للدوران حول إفريقيا بدأت من:", a: ["البحر الأحمر", "البحر المتوسط", "المحيط الأطلسي", "خليج غينيا"], c: 0 },

    { q: "استمرت رحلة بعثة الملك نخاو الثاني حول إفريقيا حوالي:", a: ["ثلاث سنوات", "ثلاثة أشهر", "سنة واحدة", "عشر سنوات"], c: 0 },

    { q: "من نتائج رحلة الملك نخاو الثاني حول إفريقيا:", a: ["وصول المصريين القدماء إلى السودان وبعض دول شرق إفريقيا", "اكتشاف أمريكا", "الوصول إلى أستراليا", "اكتشاف أوروبا"], c: 0 },

    { q: "اهتم محمد علي باشا باكتشاف:", a: ["منافع النيل", "مناجم الذهب في أوروبا", "طريق رأس الرجاء الصالح", "سواحل أمريكا"], c: 0 },

    { q: "أرسل محمد علي باشا رحلات لاكتشاف منابع النيل عام:", a: ["1839م", "1798م", "1882م", "1919م"], c: 0 },

    { q: "وصل نفوذ الخديو إسماعيل إلى:", a: ["جنوب دائرة الاستواء", "شمال أوروبا", "أمريكا الشمالية", "أستراليا"], c: 0 },

    { q: "من أشهر الرحالة العرب الذين أسهموا في اكتشاف أجزاء من إفريقيا:", a: ["ابن بطوطة", "هنري الملاح", "فاسكو دا جاما", "محمد علي باشا"], c: 0 },

    { q: "استطاع ابن بطوطة أن يخترق:", a: ["الصحراء الكبرى من الشمال إلى الجنوب حتى وصل إلى مالي", "البحر المتوسط من إفريقيا إلى أوروبا", "المحيط الأطلسي إلى أمريكا", "المحيط الهندي إلى أستراليا"], c: 0 },

    { q: "كان من أوائل الرحالة العرب الذين زاروا إفريقيا وكتبوا عنها:", a: ["المسعودي", "هنري الملاح", "محمد علي باشا", "الخديو إسماعيل"], c: 0 },

    { q: "بدأ البرتغاليون محاولاتهم لاكتشاف إفريقيا خلال القرن:", a: ["15م", "12م", "18م", "20م"], c: 0 },

    { q: "استفاد البرتغاليون في رحلاتهم الاستكشافية من:", a: ["ما كتبه العرب عن إفريقيا", "خرائط أمريكا الحديثة", "الطائرات", "الأقمار الصناعية"], c: 0 },

    { q: "حاول البرتغاليون الوصول إلى الهند عن طريق:", a: ["الدوران حول إفريقيا", "الدوران حول أوروبا", "عبور المحيط الهادئ", "عبور أمريكا الشمالية"], c: 0 },

    { q: "عرف البرتغاليون الطريق البحري إلى الهند عن طريق:", a: ["رأس الرجاء الصالح", "مضيق جبل طارق فقط", "قناة السويس", "مضيق باب المندب فقط"], c: 0 },

    { q: "من الدول الأوروبية التي توالت في الكشف عن قارة إفريقيا خلال نهاية القرن 18م وخلال القرن 19م:", a: ["الإنجليز والفرنسيون والهولنديون", "الصينيون واليابانيون", "الأمريكيون والكنديون فقط", "الإسبان فقط"], c: 0 },

    { q: "تضم قارة إفريقيا وفق الخريطة السياسية حوالي:", a: ["54 دولة", "40 دولة", "64 دولة", "74 دولة"], c: 0 },

    { q: "تُعد الجزائر أكبر دول القارة الإفريقية من حيث:", a: ["المساحة", "عدد السكان دائمًا", "عدد الأنهار", "عدد الجزر"], c: 0 },

    { q: "تقسم دول قارة إفريقيا من حيث موقعها بالنسبة للمسطحات المائية إلى:", a: ["دول ساحلية ودول حبيسة", "دول شمالية ودول جنوبية فقط", "دول صحراوية ودول جبلية فقط", "دول عربية ودول غير عربية فقط"], c: 0 },

    { q: "الدول الساحلية هي الدول التي:", a: ["تطل على مسطحات مائية مثل البحار أو المحيطات", "لا تطل على أي مسطح مائي", "تقع داخل القارة فقط", "تقع جنوب دائرة الاستواء فقط"], c: 0 },

    { q: "الدول الحبيسة هي الدول التي:", a: ["لا تطل على مسطحات مائية مثل البحار أو المحيطات", "تطل على المحيط الأطلسي فقط", "تطل على البحر المتوسط فقط", "تقع على السواحل دائمًا"], c: 0 },

    { q: "من أمثلة الدول العربية في إفريقيا:", a: ["مصر وليبيا وتونس والجزائر والمغرب والسودان وموريتانيا والصومال وجيبوتي وجزر القمر", "مصر وتشاد فقط", "كينيا وتنزانيا فقط", "إثيوبيا وأوغندا فقط"], c: 0 },

    { q: "تُعد العلاقات المصرية الإفريقية مهمة بسبب:", a: ["دور مصر في تعميق العلاقات الإفريقية وتحقيق التنمية المستدامة", "انفصال مصر عن القارة الإفريقية", "قلة العلاقات التجارية", "عدم وجود مصالح مشتركة"], c: 0 },

    { q: "تم انتخاب مصر لرئاسة الاتحاد الإفريقي عام:", a: ["2019م", "2010م", "2020م", "2022م"], c: 0 },

    { q: "أدى تولي مصر رئاسة الاتحاد الإفريقي إلى فرصة قوية لـ:", a: ["تعميق دور مصر الريادي في إفريقيا وتدعيم علاقاتها مع دول وشعوب القارة", "زيادة عزلة مصر عن إفريقيا", "وقف التعاون الإفريقي", "إلغاء العلاقات الاقتصادية"], c: 0 }
];
        let index = 0, score = 0, picked = null;

        window.onload = () => { render(); };

        function render() {
            picked = null;
            const q = questions[index];
            document.getElementById('main-question').innerText = q.q;
            document.getElementById('q-count').innerText = index + 1;
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.a.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = 'option-box p-6 rounded-2xl flex items-center gap-4 transition-all';
                btn.innerHTML = `<div class="opt-prefix">${String.fromCharCode(65 + i)}</div><span class="text-lg font-bold">${opt}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.option-box').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    picked = i;
                };
                grid.appendChild(btn);
            });
            document.getElementById('progress-bar').style.width = ((index / questions.length) * 100) + '%';
        }

        function goToNext() {
            if (picked === null) return Swal.fire({text:'اختر إجابة أولاً يا بطل!', icon:'warning', confirmButtonColor: '#8b5cf6'});
            if (picked === questions[index].c) score++;
            index++;
            if (index < questions.length) render(); else finish();
        }

        function finish() {
            document.getElementById('quiz-wrapper').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            const pct = Math.round((score / questions.length) * 100);
            document.getElementById('score-text').innerText = pct + '%';
            document.getElementById('score-circle').style.strokeDashoffset = 440 - (440 * pct) / 100;
            document.getElementById('result-msg').innerText = pct >= 50 ? "أداء رائع! استمر في التفوق" : "راجع الدرس وحاول مرة أخرى!";
        }

        function toggleExitModal(s) { document.getElementById('exit-modal').style.display = s?'flex':'none'; }
    </script>
</body>
</html>
