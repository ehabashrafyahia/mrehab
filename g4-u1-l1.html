<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار سكان مصر | مراجعة ذاتية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            user-select: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border-radius: 2rem;
        }
        .option-box {
            background: white; border: 2px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: right; cursor: pointer;
        }
        .option-box:hover { border-color: #10b981; transform: scale(1.02); }
        .option-box.selected {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-color: transparent; color: white;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
        }
        .opt-prefix {
            background: #f1f5f9; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-weight: 900; color: #64748b;
        }
        .option-box.selected .opt-prefix { background: rgba(255, 255, 255, 0.2); color: white; }
        .progress-glow {
            height: 100%; background: linear-gradient(90deg, #10b981, #3b82f6);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); border-radius: 100px;
            transition: width 0.6s ease;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.4);
        }
        #exit-modal { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="exit-modal" class="fixed inset-0 z-[2000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <h3 class="text-xl font-900 text-slate-800 mb-2">هل تريد الخروج؟</h3>
            <p class="text-slate-500 mb-6 font-bold">سيتم فقدان تقدمك في الاختبار</p>
            <div class="flex gap-3 mt-6">
                <a href="grade4.html" class="flex-1 py-3 bg-red-50 text-red-600 rounded-2xl font-bold text-center">خروج</a>
                <button onclick="toggleExitModal(false)" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-2xl font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="quiz-wrapper" class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <button onclick="toggleExitModal(true)" class="p-3 bg-white rounded-2xl shadow-sm text-slate-500 hover:text-red-500 border border-slate-100">
                <i class="fas fa-sign-out-alt rotate-180"></i>
            </button>
            <div class="bg-white px-6 py-2 rounded-2xl shadow-sm border border-slate-100 font-900 text-indigo-600">
                <span id="q-count">1</span> / 15
            </div>
            <div class="p-3 bg-indigo-50 rounded-2xl text-indigo-500">
                <i class="fas fa-graduation-cap"></i>
            </div>
        </div>

        <div class="h-3 bg-slate-200 rounded-full mb-12 overflow-hidden">
            <div id="progress-bar" class="progress-glow" style="width: 0%;"></div>
        </div>

        <div class="glass-card p-8 md:p-12 mb-10 relative">
            <h2 id="main-question" class="text-2xl md:text-3xl font-900 text-slate-800 leading-snug text-center mb-12"></h2>
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
        </div>

        <button onclick="goToNext()" class="btn-confirm w-full py-6 rounded-3xl text-white font-900 text-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
            <span>تأكيد الإجابة</span>
            <i class="fas fa-chevron-left"></i>
        </button>
    </div>

    <div id="result-view" class="hidden max-w-xl mx-auto text-center pt-10">
        <div class="glass-card p-12 shadow-2xl mb-6 bg-white">
            <div class="text-7xl mb-6">🎯</div>
            <h1 class="text-4xl font-900 text-slate-800 mb-4">نتيجة الاختبار</h1>
            <p class="text-slate-500 font-bold mb-4">اختبار سكان مصر - الصف الرابع</p>
            <div class="relative inline-block mb-6">
                <svg class="w-40 h-40 transform -rotate-90">
                    <circle cx="80" cy="80" r="70" stroke="#f1f5f9" stroke-width="12" fill="transparent" />
                    <circle id="score-circle" cx="80" cy="80" r="70" stroke="#10b981" stroke-width="12" fill="transparent" stroke-dasharray="440" stroke-dashoffset="440" class="transition-all duration-1000" />
                </svg>
                <div class="absolute inset-0 flex items-center justify-center font-900 text-4xl text-slate-800" id="score-text">0%</div>
            </div>
            <div id="result-message" class="text-xl font-bold text-indigo-600 mb-2"></div>
        </div>

        <div class="flex flex-col gap-4">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="location.reload()" class="py-4 bg-emerald-100 text-emerald-700 rounded-2xl font-bold hover:bg-emerald-200 transition">إعادة الاختبار</button>
                <a href="grade4.html" class="py-4 bg-slate-800 text-white rounded-2xl font-bold flex items-center justify-center hover:bg-slate-900 transition">الرئيسية</a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
    { q: "ما المقصود بالمخطط؟", a: ["رسم مكبر للمكان", "رسم مصغر للمكان كما نراه من أعلى", "صورة فوتوغرافية للمكان", "خريطة للعالم"], c: 1 },
    { q: "يساعدنا المخطط على:", a: ["معرفة تفاصيل المكان بوضوح", "قياس درجات الحرارة", "تحديد الوقت", "معرفة عدد السكان"], c: 0 },
    { q: "المسؤول عن تصميم وبناء المنازل والمدارس هو:", a: ["الطبيب", "المهندس", "المعلم", "الفلاح"], c: 1 },
    { q: "عند رسم مخطط للمبنى يجب رسم الشمس:", a: ["داخل المبنى", "فوق السطح", "خارج المبنى", "أسفل المبنى"], c: 2 },
    { q: "يتم إضافة الأبواب والنوافذ في المخطط لأنها:", a: ["تجمل المبنى فقط", "تسمح بدخول الهواء وضوء الشمس", "تمنع دخول الأشخاص", "تزيد مساحة المبنى"], c: 1 },
    { q: "من خطوات رسم المخطط:", a: ["كتابة أسماء الأماكن داخل المبنى", "رسم الأشجار فقط", "حذف الأبواب", "عدم كتابة أي بيانات"], c: 0 },
    { q: "الطريق الذي يبلغ طوله 500 متر هو:", a: ["المخطط الأول", "المخطط الثاني", "المخطط الثالث", "لا شيء مما سبق"], c: 1 },
    { q: "أي المخططات يحتوي على إصلاحات في الطريق؟", a: ["الأول", "الثاني", "الثالث", "جميعها"], c: 2 },
    { q: "يختار المخطط الثاني من:", a: ["يحب التسوق", "يفضل الوصول بسرعة", "يحب ممارسة المشي", "يبحث عن أطول طريق"], c: 1 },
    { q: "يختار المخطط الأول من:", a: ["يحب التسوق في الطريق", "يفضل الوصول بسرعة", "يحب الرياضة", "يريد تجنب المعالم"], c: 0 },
    { q: "يختار المخطط الثالث من:", a: ["يحب التسوق", "يفضل السرعة", "يحب ممارسة رياضة المشي", "لا يهتم بالطريق"], c: 2 },
    { q: "عند اختيار الطريق يجب أن نفكر في:", a: ["السرعة فقط", "الهدف والسهولة معًا", "عدد الأشجار", "الطقس فقط"], c: 1 },
    { q: "اعتمد الإنسان قديمًا في تحديد الاتجاهات على:", a: ["القمر فقط", "الشمس والنجوم", "الهاتف", "الراديو"], c: 1 },
    { q: "تشرق الشمس من جهة:", a: ["الغرب", "الشرق", "الشمال", "الجنوب"], c: 1 },
    { q: "إذا وقفت مواجهًا للشمس وقت الشروق فإن الغرب يكون:", a: ["أمامك", "على يمينك", "على يسارك", "خلفك"], c: 3 },
    { q: "إذا وقفت مواجهًا للشمس وقت الشروق فإن الشمال يكون:", a: ["على يمينك", "على يسارك", "خلفك", "أمامك"], c: 1 },
    { q: "عدد الاتجاهات الأصلية هو:", a: ["2", "4", "6", "8"], c: 1 },
    { q: "أي مما يلي يعد اتجاهًا أصليًا؟", a: ["الشمال الشرقي", "الجنوب الغربي", "الشرق", "الشمال الغربي"], c: 2 },
    { q: "عدد الاتجاهات الفرعية هو:", a: ["2", "4", "6", "8"], c: 1 },
    { q: "أي مما يلي يعد اتجاهًا فرعيًا؟", a: ["الشرق", "الغرب", "الشمال الشرقي", "الجنوب"], c: 2 },
    { q: "استعان المصريون القدماء بالنجم القطبي لأنه:", a: ["أقرب النجوم للأرض", "يشير دائمًا إلى الشمال", "يتحرك بسرعة", "يظهر نهارًا"], c: 1 },
    { q: "النجم القطبي هو:", a: ["نجم يظهر نهارًا", "نجم لامع يشير إلى الشمال", "كوكب", "قمر صناعي"], c: 1 },
    { q: "تستخدم النجوم لتحديد الاتجاهات:", a: ["ليلًا", "نهارًا", "صيفًا فقط", "شتاءً فقط"], c: 0 },
    { q: "البوصلة هي أداة تحتوي على:", a: ["ساعة", "إبرة مغناطيسية تشير للشمال", "عدسة مكبرة", "ميزان حرارة"], c: 1 },
    { q: "تشير إبرة البوصلة دائمًا إلى:", a: ["الجنوب", "الشرق", "الشمال المغناطيسي", "الغرب"], c: 2 },
    { q: "تستخدم البوصلة الرقمية في:", a: ["الحواسيب فقط", "الهواتف الذكية", "السيارات فقط", "التلفاز"], c: 1 },
    { q: "تتميز البوصلة الرقمية بأنها:", a: ["أقل دقة", "أسرع وأكثر دقة", "تعمل ليلًا فقط", "لا تحدد الاتجاهات"], c: 1 },
    { q: "أي مما يلي يعد من أدوات تحديد الاتجاهات؟", a: ["البوصلة", "الميزان", "المسطرة", "الترمومتر"], c: 0 },
    { q: "بيتنا الثاني الذي نتعلم فيه ونقضي أوقاتًا سعيدة هو:", a: ["المنزل", "المدرسة", "النادي", "المكتبة"], c: 1 },
    { q: "يجب أن نحافظ على المدرسة لأنها:", a: ["مكان للعب فقط", "بيتنا الثاني", "مكان مؤقت", "مكان خاص بالمعلمين"], c: 1 }
];

        let index = 0, score = 0, picked = null;

        window.onload = () => { render(); };

        function toggleExitModal(show) { 
            document.getElementById('exit-modal').style.display = show ? 'flex' : 'none'; 
        }

        function render() {
            picked = null;
            const q = questions[index];
            document.getElementById('main-question').innerText = q.q;
            document.getElementById('q-count').innerText = index + 1;
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            q.a.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = 'option-box p-6 rounded-2xl flex items-center gap-4 group';
                btn.innerHTML = `<div class="opt-prefix">${String.fromCharCode(65 + i)}</div><span class="text-lg font-bold">${opt}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.option-box').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    picked = i;
                };
                grid.appendChild(btn);
            });
            document.getElementById('progress-bar').style.width = ((index / questions.length) * 100) + '%';
        }

        function goToNext() {
            if (picked === null) {
                Swal.fire({ icon: 'warning', title: 'عفواً!', text: 'يرجى اختيار إجابة أولاً', confirmButtonColor: '#4f46e5' });
                return;
            }
            if (picked === questions[index].c) score++;
            index++;
            if (index < questions.length) render();
            else showFinalResult();
        }

        function showFinalResult() {
            document.getElementById('quiz-wrapper').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            const percent = Math.round((score / questions.length) * 100);
            document.getElementById('score-text').innerText = percent + '%';
            
            let msg = percent >= 50 ? "أحسنت يا بطل! استمر" : "حاول مرة أخرى، أنت تستطيع!";
            if(percent >= 90) msg = "ممتاز! أنت عبقري!";
            document.getElementById('result-message').innerText = msg;

            const offset = 440 - (440 * percent / 100);
            document.getElementById('score-circle').style.strokeDashoffset = offset;
        }
    </script>
</body>
</html>
