        const q = questions[currentIndex];
        document.getElementById('main-question').innerText = q.q;
        document.getElementById('q-count').innerText = currentIndex + 1;

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';

        q.a.forEach((text, idx) => {
            const div = document.createElement('div');
            div.className = 'option-box';
            div.innerHTML = `
                <div class="opt-prefix">${String.fromCharCode(65 + idx)}</div>
                <span class="text-lg font-bold">${text}</span>
            `;
            div.onclick = function() {
                document.querySelectorAll('.option-box').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                pickedAnswer = idx;
            };
            grid.appendChild(div);
        });

        const progressPercent = (currentIndex / questions.length) * 100;
        document.getElementById('progress-bar').style.width = progressPercent + '%';
    }

    // ---------- الانتقال للسؤال التالي ----------
    function goToNext() {
        if (pickedAnswer === null) {
            Swal.fire({
                icon: 'warning',
                title: 'عفواً!',
                text: 'يرجى اختيار إجابة أولاً',
                confirmButtonColor: '#4f46e5'
            });
            return;
        }

        if (pickedAnswer === questions[currentIndex].c) {
            score++;
        }

        currentIndex++;

        if (currentIndex < questions.length) {
            renderQuestion();
        } else {
            showFinalResult();
        }
    }

    // ---------- عرض النتيجة النهائية ----------
    function showFinalResult() {
        document.getElementById('quiz-wrapper').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');

        const percent = Math.round((score / questions.length) * 100);
        document.getElementById('score-text').innerText = percent + '%';

        let msg = percent >= 50 ? "أحسنت يا بطل! استمر" : "حاول مرة أخرى، أنت تستطيع!";
        if (percent >= 90) msg = "ممتاز! أنت عبقري!";
        document.getElementById('result-message').innerText = msg;

        const offset = 440 - (440 * percent / 100);
        document.getElementById('score-circle').style.strokeDashoffset = offset;
    }

    // ---------- إظهار/إخفاء مودال الخروج ----------
    function toggleExitModal(show) {
        document.getElementById('exit-modal').style.display = show ? 'flex' : 'none';
    }
</script>
</body>
</html>
